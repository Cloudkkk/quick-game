[preset.0]
name="Web"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/fonts/OFL.txt,assets/sounds/LICENSE.txt,assets/music/LICENSE.txt"
exclude_filter="tests/*,evidence/*,tools/*,.web-export/*,assets/buildings.png,*.md,Launch.command,Build-Web.command"
export_path="../estate-rise-web/dist/index.html"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release="res://.web-export/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/custom_html_shell=""
html/head_include="<script src=\"wasm-loader.js?v=2\"></script><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\"><style>html,body{margin:0;padding:0;overflow:hidden;overscroll-behavior:none;background:#8fa33b}canvas{touch-action:none;outline:none}</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
